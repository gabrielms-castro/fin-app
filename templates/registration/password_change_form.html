<!doctype html>
<html lang="pt-BR">
<head>
  {% include "partials/head.html" %}
  <title>Trocar senha · Fin App</title>
</head>
<body class="grid min-h-screen place-items-center p-4">
  <form method="post" class="card w-full max-w-sm space-y-4">
    {% csrf_token %}
    <div class="flex items-center gap-3">
      <span class="grid size-10 place-items-center rounded-xl bg-indigo-600 text-white"><i data-lucide="key-round" class="size-5"></i></span>
      <div><h1 class="text-xl font-bold">Trocar senha</h1><p class="muted text-sm">{{ user.get_username }}</p></div>
    </div>
    {% for error in form.non_field_errors %}<p class="field-error flex items-center gap-1.5 !text-sm"><i data-lucide="circle-alert" class="size-4"></i>{{ error }}</p>{% endfor %}
    <label class="field">Senha atual
      <input class="input{% if form.old_password.errors %} input-error{% endif %}" name="old_password" type="password" autocomplete="current-password" required autofocus>
      {% for error in form.old_password.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
    </label>
    <label class="field">Nova senha
      <input class="input{% if form.new_password1.errors %} input-error{% endif %}" name="new_password1" type="password" autocomplete="new-password" required>
      {% for error in form.new_password1.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      <span class="hint">Pelo menos 8 caracteres, não só números e não parecida com o usuário.</span>
    </label>
    <label class="field">Confirme a nova senha
      <input class="input{% if form.new_password2.errors %} input-error{% endif %}" name="new_password2" type="password" autocomplete="new-password" required>
      {% for error in form.new_password2.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
    </label>
    <div class="flex gap-2">
      <a href="/" class="btn flex-1">Voltar</a>
      <button class="btn btn-primary flex-1">Salvar</button>
    </div>
  </form>
  <script>lucide.createIcons();</script>
</body>
</html>
